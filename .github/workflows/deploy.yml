    deploy:
        # needs: eval
        # if: ${{ needs.eval.outputs.score >= '0.80' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Debug GitHub OIDC context
              run: |
                  echo "Repository: $GITHUB_REPOSITORY"
                  echo "Ref: $GITHUB_REF"
                  echo "Event: $GITHUB_EVENT_NAME"
                  echo "Actor: $GITHUB_ACTOR"
                  echo ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  echo ${{ secrets.AWS_REGION }}

            # AWS OIDC authentication
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            # ECR login
            - name: Login to Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                  mask-password: "true"

            # Build and push Docker image
            - name: Build and push image
              id: build
              env:
                  ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" 
                  echo "Building: $IMAGE_URI" 
                  docker build \
                   --target production \
                   -t "$IMAGE_URI" \ 
                   . 
                   
                  docker push "$IMAGE_URI" 
                  echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

            # Get current ECS task definition
            - name: Download task definition
              run: |
                  aws ecs describe-task-definition \
                   --task-definition "$ECS_TASK_DEFINITION" \
                   --query taskDefinition \
                   --output json > task-definition.json

            # Update image
            - name: Render new task definition
              id: task-definition
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-definition.json
                  container-name: ${{ secrets.CONTAINER_NAME }}
                  image: ${{ steps.build.outputs.image }}

            # Deploy ECS service
            - name: Deploy Amazon ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: ${{ steps.task-definition.outputs.task-definition }}
                  service: ${{ secrets.ECS_SERVICE }}
                  cluster: ${{ secrets.ECS_CLUSTER }}
                  wait-for-service-stability: true

            - name: Deployment complete
              run: |
                  echo "Deployment successful!" 
                  echo "Image: ${{ steps.build.outputs.image }}"
