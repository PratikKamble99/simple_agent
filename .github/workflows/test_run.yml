name: CI/CD

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            UV_FROZEN: "1"
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: uv.lock
            # fails if pyproject.toml changed without re-locking
            - run: uv lock --check

            - run: uv sync --all-groups
            - run: uv run ruff check .
            - run: uv run alembic upgrade head
            - run: uv run pytest -q --cov=app

            # boot smoke test — catches import errors, bad settings, missing env
            # - name: App starts and serves /health
            #   run: |
            #       uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 &
            #       for i in {1..20}; do
            #         curl -fsS http://127.0.0.1:8000/health && exit 0
            #         sleep 1
            #       done
            #       exit 1

    eval:
        needs: test
        runs-on: ubuntu-latest
        env:
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            QDRANT_URL: ${{ secrets.QDRANT_URL }}
            QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        timeout-minutes: 30
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: uv.lock
            - run: uv lock --check
            - run: uv sync --all-groups
            - name: Run Evaluation
              run: uv run -m evaluation.rag_eval

            - name: Extract score
              id: eval-score
              run: |
                  SCORE=$(grep "average_score:" reports.json | awk '{print $3}')

                  echo "Evaluation score: $SCORE"

                  echo "score=$SCORE" >> "$GITHUB_OUTPUT"

    deploy:
        needs: eval
        if: ${{ needs.eval.outputs.score >= '0.80' }}
        runs-on: ubuntu-latest

        steps:
            - name: Deploy
              run: echo "Deploying..."
