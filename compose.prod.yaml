# compose.prod.yaml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: production
      
    ports:
      - "8000:8000"

    restart: unless-stopped